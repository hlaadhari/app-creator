# Configuration Supabase - Sprout Workshop (Labo STI)
project_id = "dxanlvsonydghkmycexq"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_positive_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.buckets.sujets-assets]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/svg+xml", "image/gif", "image/webp"]

[storage.buckets.projets-eleves]
public = false
file_size_limit = "25MiB"

[analytics]
enabled = false