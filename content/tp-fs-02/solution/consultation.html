<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Consultation Météo Régionale</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 40px auto;
        max-width: 600px;
        padding: 20px;
      }
      h1 {
        color: #0066cc;
        text-align: center;
      }
      form {
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 24px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
      }
      select,
      input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        background: #0066cc;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #0052a3;
      }
    </style>

  <body>
    <h1>Consultation Météo Régionale – Synthèse Statistique</h1>

    <form id="fMeteo" name="fMeteo" action="meteo.php" method="post" onsubmit="return test2();">
      <div class="form-group">
        <label for="station">Station Météo :</label>
        <select id="station" name="station">
          <option value="">-- Choisir une station --</option>
          <option value="1">Station Nord (Tunis)</option>
          <option value="2">Station Sahel (Sousse)</option>
          <option value="3">Station Sud (Sfax)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="annee">Année d'observation :</label>
        <input type="number" id="annee" name="annee" min="2020" max="2026" value="2026" />
      </div>

      <div class="form-group" style="text-align: center">
        <button type="submit" id="btnConsulter">Afficher les statistiques</button>
      </div>
    </form>

    <script src="controle.js"></script>
  </body>
</html>
