name: CI - Labo STI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Format Check, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org || bun install --registry https://registry.npmjs.org

      - name: Format check (Prettier --check)
        run: bun run format:check

      - name: Lint (ESLint blocking, max-warnings=0)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit & regression tests
        run: bun run test

      - name: Build application (Standard & Vercel verification)
        run: |
          echo "Building standard target..."
          bun run build
          echo "Verifying Vercel Nitro build..."
          NITRO_PRESET=vercel bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}

      - name: Security Check T-12 (No Secrets in Client Bundle or Repository)
        run: |
          echo "Scanning build artifacts for forbidden secrets (SUPABASE_SERVICE_ROLE_KEY, sb_secret_, service_role JWT)..."
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|sb_secret_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*service_role" dist/ .output/ .vercel/ 2>/dev/null; then
            echo "SECURITY VIOLATION (T-12): secret or service_role token detected in client build!"
            exit 1
          fi
          echo "Security Check T-12 passed: No leaks detected."

  test-db:
    name: PostgreSQL 16 Migrations & Real RLS Negative Tests (T-01 to T-18)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labo_sti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SQL migrations and real RLS negative tests (T-01 to T-18)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labo_sti_test
        run: bash scripts/run-db-tests.sh

  e2e:
    name: E2E Playwright (parcours par rôle, app déployée)
    runs-on: ubuntu-latest
    # Les comptes de test sont des secrets : sans eux, les tests s'ignorent proprement.
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://127.0.0.1:4173' }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
      E2E_ELEVE_EMAIL: ${{ secrets.E2E_ELEVE_EMAIL }}
      E2E_ELEVE_PASSWORD: ${{ secrets.E2E_ELEVE_PASSWORD }}
      E2E_ENSEIGNANT_EMAIL: ${{ secrets.E2E_ENSEIGNANT_EMAIL }}
      E2E_ENSEIGNANT_PASSWORD: ${{ secrets.E2E_ENSEIGNANT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org || bun install --registry https://registry.npmjs.org

      - name: Build application for E2E preview
        if: ${{ !vars.E2E_BASE_URL }}
        env:
          NITRO_PRESET: node-server
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E
        run: bun run e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
