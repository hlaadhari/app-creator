name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["CI - Labo STI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel (After CI Success)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Verify VERCEL_TOKEN and Project IDs availability
        id: check_token
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice ::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not configured in repository secrets. Skipping CLI deployment (using native Vercel GitHub integration)."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Checkout code
        if: steps.check_token.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        if: steps.check_token.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.check_token.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      - name: Install Pinned Vercel CLI
        if: steps.check_token.outputs.configured == 'true'
        run: npm install --global vercel@41.4.1

      - name: Pull Vercel Environment Information
        if: steps.check_token.outputs.configured == 'true'
        run: |
          if [ "${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}" = "true" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Verify Supabase secrets
        if: steps.check_token.outputs.configured == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Secrets GitHub VITE_SUPABASE_URL et VITE_SUPABASE_PUBLISHABLE_KEY requis pour déployer."
            exit 1
          fi

      - name: Build Project Artifacts
        if: steps.check_token.outputs.configured == 'true'
        run: |
          if [ "${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}" = "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          NITRO_PRESET: vercel

      - name: Deploy Project Artifacts to Vercel
        if: steps.check_token.outputs.configured == 'true'
        run: |
          if [ "${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}" = "true" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
