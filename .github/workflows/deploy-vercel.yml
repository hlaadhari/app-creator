name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Verify VERCEL_TOKEN availability
        id: check_token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice ::VERCEL_TOKEN is not configured in repository secrets. Skipping deployment. (Use Vercel's native GitHub App integration or configure VERCEL_TOKEN secret)."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Checkout code
        if: steps.check_token.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.check_token.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.check_token.outputs.configured == 'true'
        run: bun install

      - name: Install Vercel CLI
        if: steps.check_token.outputs.configured == 'true'
        run: bun add -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check_token.outputs.configured == 'true'
        run: |
          if [ "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" = "true" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build Project Artifacts
        if: steps.check_token.outputs.configured == 'true'
        run: |
          if [ "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" = "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://dxanlvsonydghkmycexq.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6oy2IYNYBkyKr0umKULwVw_vy7bVVIZ' }}
          NITRO_PRESET: vercel

      - name: Deploy Project Artifacts to Vercel
        if: steps.check_token.outputs.configured == 'true'
        run: |
          if [ "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" = "true" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
